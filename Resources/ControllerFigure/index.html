<!DOCTYPE html>
<!--
  Figura do controle do editor de atalhos (`004-figura-controle-web` D-01, D-06, D-16, D-17, RN-01, RN-05).
  Página local, sem rede, sem bibliotecas: um SVG de 830 × 620 com a silhueta plana do DualSense e um grupo
  `[data-button]` por botão (linha-guia, área de acerto de 60 × 60, desenho e rótulo), mais uma camada de balões com
  o resumo da ação, posicionados pela tabela de figure.js. O estado chega por `figure.render(state)` e o clique volta
  por `messageHandlers.figure`. Disposição vista de cima: L2/R2 na borda de trás, sobre L1/R1 nos ombros, direcional à esquerda, △ ○ ✕ □ à
  direita, touchpad ao centro com Create e Options ao lado, PS abaixo, L3 e R3 nas hastes (emenda E003).
  O Share do Ipega fica à esquerda do touchpad, abaixo de Create; `data-controller` na raiz decide se ele aparece e se
  o touchpad é marcado como ausente (`007-controle-ipega` D-08, D-09).
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=830, initial-scale=1">
  <title>Figura do controle</title>
  <link rel="stylesheet" href="figure.css">
</head>
<body>
  <div class="figure" data-controller="dualSense">
    <svg class="canvas" viewBox="0 0 830 620" width="830" height="620" aria-hidden="true">
      <rect class="frame" x="1" y="1" width="828" height="618" rx="48" ry="48"/>

      <!-- Silhueta plana do DualSense, cerca de 460 × 300 px ao centro: corpo, ombros e empunhaduras. -->
      <path class="body" d="M 240 190 H 590 Q 626 190 630 226 L 644 400 Q 652 476 610 484 Q 572 490 552 454 L 530 420 Q 472 448 415 448 Q 358 448 300 420 L 278 454 Q 258 490 220 484 Q 178 476 186 400 L 200 226 Q 204 190 240 190 Z"/>
      <path class="body-detail" d="M 335 205 H 495 Q 500 205 500 210 V 280 Q 500 285 495 285 H 335 Q 330 285 330 280 V 210 Q 330 205 335 205 Z"/>

      <g class="button" data-button="l2">
        <line class="guide" x1="246" y1="132" x2="246" y2="132"/>
        <rect class="hit" x="216" y="102" width="60" height="60"/>
        <rect class="shape" x="212" y="119" width="68" height="26" rx="10" ry="10"/>
        <text class="label" x="246" y="132" font-size="22">L2</text>
      </g>
      <g class="button" data-button="l1">
        <line class="guide" x1="246" y1="172" x2="246" y2="172"/>
        <rect class="hit" x="216" y="142" width="60" height="60"/>
        <rect class="shape" x="212" y="159" width="68" height="26" rx="10" ry="10"/>
        <text class="label" x="246" y="172" font-size="22">L1</text>
      </g>
      <g class="button" data-button="r2">
        <line class="guide" x1="584" y1="132" x2="584" y2="132"/>
        <rect class="hit" x="554" y="102" width="60" height="60"/>
        <rect class="shape" x="550" y="119" width="68" height="26" rx="10" ry="10"/>
        <text class="label" x="584" y="132" font-size="22">R2</text>
      </g>
      <g class="button" data-button="r1">
        <line class="guide" x1="584" y1="172" x2="584" y2="172"/>
        <rect class="hit" x="554" y="142" width="60" height="60"/>
        <rect class="shape" x="550" y="159" width="68" height="26" rx="10" ry="10"/>
        <text class="label" x="584" y="172" font-size="22">R1</text>
      </g>
      <g class="button" data-button="create">
        <line class="guide" x1="308" y1="205" x2="308" y2="205"/>
        <rect class="hit" x="278" y="175" width="60" height="60"/>
        <rect class="shape" x="300" y="190" width="16" height="30" rx="8" ry="8"/>
        <text class="label" x="308" y="180" font-size="18">Create</text>
      </g>
      <g class="button" data-button="options">
        <line class="guide" x1="522" y1="205" x2="522" y2="205"/>
        <rect class="hit" x="492" y="175" width="60" height="60"/>
        <rect class="shape" x="514" y="190" width="16" height="30" rx="8" ry="8"/>
        <text class="label" x="522" y="180" font-size="18">Options</text>
      </g>
      <g class="button" data-button="touchpadClick">
        <line class="guide" x1="415" y1="245" x2="415" y2="245"/>
        <rect class="hit" x="385" y="215" width="60" height="60"/>
        <rect class="shape" x="345" y="205" width="140" height="80" rx="12" ry="12"/>
        <text class="label" x="415" y="245" font-size="26">Touchpad</text>
      </g>
      <!-- Depois do touchpad e antes do direcional: nas sobreposições da área de acerto, o direcional prevalece. -->
      <g class="button" data-button="share">
        <line class="guide" x1="316" y1="246" x2="316" y2="246"/>
        <rect class="hit" x="286" y="216" width="60" height="60"/>
        <circle class="shape" cx="316" cy="246" r="9"/>
        <text class="label" x="316" y="268" font-size="13">Share</text>
      </g>
      <g class="button" data-button="dpadUp">
        <line class="guide" x1="287" y1="250" x2="287" y2="250"/>
        <rect class="hit" x="257" y="220" width="60" height="60"/>
        <rect class="shape" x="275" y="235" width="24" height="30" rx="6" ry="6"/>
        <text class="label" x="287" y="250" font-size="26">↑</text>
      </g>
      <g class="button" data-button="dpadLeft">
        <line class="guide" x1="237" y1="300" x2="237" y2="300"/>
        <rect class="hit" x="207" y="270" width="60" height="60"/>
        <rect class="shape" x="222" y="288" width="30" height="24" rx="6" ry="6"/>
        <text class="label" x="237" y="300" font-size="26">←</text>
      </g>
      <g class="button" data-button="dpadRight">
        <line class="guide" x1="337" y1="300" x2="337" y2="300"/>
        <rect class="hit" x="307" y="270" width="60" height="60"/>
        <rect class="shape" x="322" y="288" width="30" height="24" rx="6" ry="6"/>
        <text class="label" x="337" y="300" font-size="26">→</text>
      </g>
      <g class="button" data-button="dpadDown">
        <line class="guide" x1="287" y1="350" x2="287" y2="350"/>
        <rect class="hit" x="257" y="320" width="60" height="60"/>
        <rect class="shape" x="275" y="335" width="24" height="30" rx="6" ry="6"/>
        <text class="label" x="287" y="350" font-size="26">↓</text>
      </g>
      <g class="button" data-button="triangle">
        <line class="guide" x1="543" y1="250" x2="543" y2="250"/>
        <rect class="hit" x="513" y="220" width="60" height="60"/>
        <circle class="shape" cx="543" cy="250" r="17"/>
        <text class="label symbol-triangle" x="543" y="250" font-size="26">△</text>
      </g>
      <g class="button" data-button="square">
        <line class="guide" x1="493" y1="300" x2="493" y2="300"/>
        <rect class="hit" x="463" y="270" width="60" height="60"/>
        <circle class="shape" cx="493" cy="300" r="17"/>
        <text class="label symbol-square" x="493" y="300" font-size="26">□</text>
      </g>
      <g class="button" data-button="circle">
        <line class="guide" x1="593" y1="300" x2="593" y2="300"/>
        <rect class="hit" x="563" y="270" width="60" height="60"/>
        <circle class="shape" cx="593" cy="300" r="17"/>
        <text class="label symbol-circle" x="593" y="300" font-size="26">○</text>
      </g>
      <g class="button" data-button="cross">
        <line class="guide" x1="543" y1="350" x2="543" y2="350"/>
        <rect class="hit" x="513" y="320" width="60" height="60"/>
        <circle class="shape" cx="543" cy="350" r="17"/>
        <text class="label symbol-cross" x="543" y="350" font-size="26">✕</text>
      </g>
      <g class="button" data-button="ps">
        <line class="guide" x1="415" y1="388" x2="415" y2="388"/>
        <rect class="hit" x="385" y="358" width="60" height="60"/>
        <circle class="shape" cx="415" cy="388" r="18"/>
        <text class="label" x="415" y="388" font-size="18">PS</text>
      </g>
      <g class="button" data-button="l3">
        <line class="guide" x1="372" y1="410" x2="372" y2="410"/>
        <rect class="hit" x="342" y="380" width="60" height="60"/>
        <circle class="shape" cx="372" cy="410" r="26"/>
        <text class="label" x="372" y="410" font-size="22">L3</text>
      </g>
      <g class="button" data-button="r3">
        <line class="guide" x1="458" y1="410" x2="458" y2="410"/>
        <rect class="hit" x="428" y="380" width="60" height="60"/>
        <circle class="shape" cx="458" cy="410" r="26"/>
        <text class="label" x="458" y="410" font-size="22">R3</text>
      </g>
    </svg>

    <div class="balloons">
      <div class="balloon" data-button="l1"><span class="summary"></span></div>
      <div class="balloon" data-button="l2"><span class="summary"></span></div>
      <div class="balloon" data-button="r1"><span class="summary"></span></div>
      <div class="balloon" data-button="r2"><span class="summary"></span></div>
      <div class="balloon" data-button="create"><span class="summary"></span></div>
      <div class="balloon" data-button="options"><span class="summary"></span></div>
      <div class="balloon" data-button="touchpadClick"><span class="summary"></span></div>
      <div class="balloon" data-button="dpadUp"><span class="summary"></span></div>
      <div class="balloon" data-button="dpadLeft"><span class="summary"></span></div>
      <div class="balloon" data-button="dpadRight"><span class="summary"></span></div>
      <div class="balloon" data-button="dpadDown"><span class="summary"></span></div>
      <div class="balloon" data-button="triangle"><span class="summary"></span></div>
      <div class="balloon" data-button="square"><span class="summary"></span></div>
      <div class="balloon" data-button="circle"><span class="summary"></span></div>
      <div class="balloon" data-button="cross"><span class="summary"></span></div>
      <div class="balloon" data-button="ps"><span class="summary"></span></div>
      <div class="balloon" data-button="l3"><span class="summary"></span></div>
      <div class="balloon" data-button="r3"><span class="summary"></span></div>
      <div class="balloon is-compact" data-button="share"><span class="summary"></span></div>
    </div>
  </div>
  <script src="figure.js"></script>
</body>
</html>
